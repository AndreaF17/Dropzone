<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>// DROPZONE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0b14'/%3E%3Cpath d='M16 6l8 9h-5v9h-6v-9H8z' fill='%2322d3ee'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #070711; --bg-2: #0b0b18; --panel: rgba(16,16,34,.72);
    --cyan: #28e0ff; --magenta: #ff2fb0; --violet: #9b5cff; --lime: #b6ff3c;
    --text: #e8e8ff; --muted: #7d7db0; --dim: #53537d;
    --border: rgba(155,92,255,.22); --border-2: rgba(40,224,255,.38);
    --mono: "SFMono-Regular", ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: var(--mono); color: var(--text);
    background: var(--bg);
    display: flex; justify-content: center; padding: 34px 18px 64px;
    overflow-x: hidden;
  }
  /* animated aurora blobs */
  .aurora { position: fixed; inset: -20% -10%; z-index: 0; filter: blur(70px); opacity: .55; pointer-events: none; }
  .aurora b { position: absolute; border-radius: 50%; mix-blend-mode: screen; animation: drift 18s ease-in-out infinite; }
  .aurora b:nth-child(1) { width: 46vw; height: 46vw; left: -6%; top: -8%; background: radial-gradient(circle, var(--violet), transparent 65%); }
  .aurora b:nth-child(2) { width: 42vw; height: 42vw; right: -8%; top: 4%; background: radial-gradient(circle, var(--magenta), transparent 65%); animation-delay: -6s; }
  .aurora b:nth-child(3) { width: 50vw; height: 50vw; left: 22%; bottom: -24%; background: radial-gradient(circle, var(--cyan), transparent 65%); animation-delay: -11s; }
  @keyframes drift { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(6%,4%) scale(1.12); } 66% { transform: translate(-5%,3%) scale(.92); } }
  /* faint scanlines + grain overlay */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 40;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply; opacity: .35; animation: scan 8s linear infinite;
  }
  @keyframes scan { to { background-position: 0 -300px; } }

  .wrap { width: 100%; max-width: 780px; position: relative; z-index: 2; }

  .term {
    position: relative; border-radius: 12px; overflow: hidden;
    background: var(--panel);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.04);
    animation: boot .55s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes boot { from { opacity: 0; transform: translateY(14px); filter: brightness(1.8) saturate(2); } to { opacity: 1; transform: none; filter: none; } }
  /* animated neon gradient border */
  .term::before {
    content: ""; position: absolute; inset: 0; border-radius: 12px; padding: 1px; z-index: 3;
    background: conic-gradient(from 0deg, var(--cyan), var(--violet), var(--magenta), var(--cyan));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: .7; animation: spin 7s linear infinite;
  }
  @keyframes spin { to { filter: hue-rotate(360deg); } }

  .bar { position: relative; z-index: 4; display: flex; align-items: center; gap: 10px; padding: 11px 15px; border-bottom: 1px solid var(--border); }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.a { background: var(--magenta); box-shadow: 0 0 10px var(--magenta); }
  .dot.b { background: var(--violet); box-shadow: 0 0 10px var(--violet); }
  .dot.c { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  .bar .ttl { margin-left: 8px; color: var(--muted); font-size: 12.5px; letter-spacing: .6px; }
  .bar .conn { margin-left: auto; color: var(--muted); font-size: 11.5px; display: flex; align-items: center; gap: 7px; text-transform: uppercase; letter-spacing: 1px; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .pulse.live { background: var(--cyan); box-shadow: 0 0 12px var(--cyan); animation: pp 1.4s ease-in-out infinite; }
  @keyframes pp { 50% { opacity: .35; } }
  .blink { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }

  .body { position: relative; z-index: 4; padding: 26px 22px 24px; }

  /* glitch wordmark */
  .brand { display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px; }
  .glitch { position: relative; font-size: 40px; font-weight: 800; letter-spacing: 6px; line-height: 1;
    background: linear-gradient(90deg, var(--cyan), var(--violet) 55%, var(--magenta));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .glitch::before, .glitch::after { content: attr(data-t); position: absolute; left: 0; top: 0; -webkit-background-clip: text; background-clip: text; color: transparent; }
  .glitch::before { background: var(--magenta); -webkit-background-clip: text; animation: gl1 3.2s infinite steps(2); }
  .glitch::after { background: var(--cyan); -webkit-background-clip: text; animation: gl2 2.6s infinite steps(2); }
  @keyframes gl1 { 0%,92%,100% { transform: translate(0,0); opacity: 0; } 93% { transform: translate(-2px,-1px); opacity: .7; } 97% { transform: translate(2px,1px); opacity: .5; } }
  @keyframes gl2 { 0%,90%,100% { transform: translate(0,0); opacity: 0; } 91% { transform: translate(2px,1px); opacity: .6; } 95% { transform: translate(-2px,0); opacity: .45; } }
  .ver { color: var(--dim); font-size: 12px; letter-spacing: 2px; }
  .tag { color: var(--muted); font-size: 12px; margin-bottom: 22px; min-height: 16px; }
  .tag b { color: var(--cyan); }

  .prompt { color: var(--violet); font-size: 12.5px; margin: 0 0 9px; }
  .prompt .u { color: var(--cyan); } .prompt .p { color: var(--magenta); }

  .drop { position: relative; display: block; border: 1px dashed var(--border-2); border-radius: 10px; padding: 32px 18px; text-align: center; cursor: pointer; background: rgba(40,224,255,.03); transition: border-color .15s, background .15s, box-shadow .15s, transform .1s; }
  .drop:hover { border-color: var(--cyan); background: rgba(40,224,255,.06); }
  .drop.drag { border-color: var(--magenta); background: rgba(255,47,176,.09); box-shadow: inset 0 0 44px rgba(255,47,176,.12); transform: scale(1.006); }
  .drop .ico { font-size: 30px; background: linear-gradient(90deg, var(--cyan), var(--magenta)); -webkit-background-clip: text; background-clip: text; color: transparent; animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .drop p { margin: 10px 0 2px; color: var(--text); font-size: 13.5px; }
  .drop .hint { color: var(--muted); font-size: 11.5px; }
  .drop .browse { color: var(--magenta); }
  input[type=file] { display: none; }

  .files { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: rgba(255,255,255,.015); animation: slidein .25s ease both; }
  @keyframes slidein { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
  .row .k { color: var(--violet); flex: 0 0 auto; }
  .meta { flex: 1; min-width: 0; }
  .name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .size { color: var(--muted); font-size: 11px; margin-top: 1px; }
  .bar2 { height: 4px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; margin-top: 8px; }
  .bar2 > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--magenta)); box-shadow: 0 0 10px rgba(40,224,255,.6); transition: width .15s; }
  .st { font-size: 11.5px; flex: 0 0 auto; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .st.ok { color: var(--lime); } .st.err { color: var(--magenta); }
  .bar2.ok > i { background: var(--lime); box-shadow: 0 0 10px rgba(182,255,60,.5); }
  .bar2.err > i { background: var(--magenta); box-shadow: none; opacity: .55; }

  .controls { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; margin-top: 18px; }
  button { font: inherit; font-size: 12.5px; letter-spacing: .6px; cursor: pointer; color: var(--text); background: rgba(155,92,255,.1); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; transition: background .14s, box-shadow .14s, transform .08s, border-color .14s; }
  button:hover { border-color: var(--violet); box-shadow: 0 0 16px rgba(155,92,255,.3); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: default; box-shadow: none; }
  button.exec { color: #0a0a16; font-weight: 800; border: 0; background: linear-gradient(90deg, var(--cyan), var(--magenta)); background-size: 200% 100%; animation: sheen 4s linear infinite; }
  @keyframes sheen { to { background-position: 200% 0; } }
  button.exec:hover:not(:disabled) { box-shadow: 0 0 24px rgba(255,47,176,.5); }
  .tokwrap { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
  .tokwrap input { font: inherit; font-size: 12px; color: var(--cyan); background: rgba(0,0,0,.35); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; width: 150px; outline: none; }
  .tokwrap input:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(40,224,255,.3); }

  .sep { margin: 26px 0 14px; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
  .sep::before, .sep::after { content: ""; height: 1px; flex: 1; background: linear-gradient(90deg, transparent, var(--border), transparent); }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tab { font-size: 11.5px; padding: 7px 13px; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); cursor: pointer; background: transparent; transition: color .12s, border-color .12s, background .12s; }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--cyan); border-color: var(--border-2); background: rgba(40,224,255,.08); box-shadow: 0 0 14px rgba(40,224,255,.14); }
  .snip { position: relative; border: 1px solid var(--border); border-radius: 10px; background: rgba(0,0,0,.4); }
  .snip pre { margin: 0; padding: 15px 56px 15px 15px; overflow-x: auto; font-size: 12px; line-height: 1.65; color: var(--text); white-space: pre; }
  .snip pre .c { color: var(--magenta); } .snip pre .s { color: var(--cyan); } .snip pre .m { color: var(--dim); }
  .copy { position: absolute; top: 9px; right: 9px; padding: 6px 10px; font-size: 11px; color: var(--cyan); background: rgba(40,224,255,.08); border: 1px solid var(--border-2); border-radius: 6px; cursor: pointer; transition: background .12s; }
  .copy:hover { background: rgba(40,224,255,.16); }
  .copy.done { color: #0a0a16; background: var(--lime); border-color: var(--lime); }

  footer { text-align: center; margin-top: 20px; color: var(--dim); font-size: 11px; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="aurora"><b></b><b></b><b></b></div>
  <div class="wrap">
    <div class="term">
      <div class="bar">
        <span class="dot a"></span><span class="dot b"></span><span class="dot c"></span>
        <span class="ttl">node@dropzone: ~/uploads</span>
        <span class="conn"><span class="pulse" id="pulse"></span><span id="conntxt">offline</span></span>
      </div>
      <div class="body">
        <div class="brand">
          <span class="glitch" data-t="DROPZONE">DROPZONE</span>
          <span class="ver">v0.1.0</span>
        </div>
        <div class="tag" id="tag"></div>

        <div class="prompt"><span class="u">operator</span>@<span class="p">dropzone</span>:~$ upload --files</div>
        <label class="drop" id="drop">
          <div class="ico">⬆</div>
          <p>[ drop files here ] or <span class="browse">./browse</span></p>
          <div class="hint">multi-select enabled · live upload progress</div>
          <input type="file" id="picker" multiple />
        </label>

        <div class="files" id="list"></div>

        <div class="controls">
          <button class="exec" id="send" disabled>&gt;_ SEND</button>
          <button id="clear" disabled>clear</button>
          <div class="tokwrap">--token <input id="tok" type="password" placeholder="(none)" autocomplete="off" /></div>
        </div>

        <div class="sep">transfer examples</div>
        <div class="tabs" id="tabs"></div>
        <div class="snip">
          <button class="copy" id="copy">copy</button>
          <pre id="snippet"></pre>
        </div>

        <footer>// use only against systems you are authorized to test <span class="blink">_</span></footer>
      </div>
    </div>
  </div>

<script>
(function () {
  var picker = document.getElementById('picker');
  var drop = document.getElementById('drop');
  var listEl = document.getElementById('list');
  var sendBtn = document.getElementById('send');
  var clearBtn = document.getElementById('clear');
  var tok = document.getElementById('tok');
  var tabsEl = document.getElementById('tabs');
  var snippetEl = document.getElementById('snippet');
  var copyBtn = document.getElementById('copy');
  var tagEl = document.getElementById('tag');
  var pulse = document.getElementById('pulse');
  var conntxt = document.getElementById('conntxt');
  var queue = [];
  var base = window.location.origin;

  var tagText = '// staged upload endpoint · files sorted into uploads/<ip>/ · authorized engagements only';
  (function typeTag(i) {
    tagEl.innerHTML = tagText.slice(0, i).replace('uploads/<ip>/', '<b>uploads/&lt;ip&gt;/</b>');
    if (i <= tagText.length) setTimeout(function () { typeTag(i + 1); }, 11);
  })(0);

  function esc(s) { return s.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    var u = ['KB', 'MB', 'GB', 'TB'], i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
    return n.toFixed(1) + ' ' + u[i];
  }

  function tokenCurl() { var t = tok.value.trim(); return t ? '-H <c>"Authorization: Bearer ' + esc(t) + '"</c> ' : ''; }
  function tokenPwsh() { var t = tok.value.trim(); return t ? ' `\n  -Headers @{ Authorization = <s>"Bearer ' + esc(t) + '"</s> }' : ''; }
  function tokenWget() { var t = tok.value.trim(); return t ? '--header=<s>"Authorization: Bearer ' + esc(t) + '"</s> ' : ''; }

  var recipes = {
    'curl · form': function () {
      return '<m># multipart, field name must be "file"</m>\n' +
        'curl ' + tokenCurl() + '-F <s>"file=@./notes.txt"</s> <c>' + base + '/upload</c>';
    },
    'curl · raw': function () {
      return '<m># raw body, name taken from the URL</m>\n' +
        'curl ' + tokenCurl() + '-X PUT --data-binary <s>@./notes.txt</s> <c>' + base + '/upload/notes.txt</c>';
    },
    'powershell': function () {
      return '<m># raw body (any PowerShell version)</m>\n' +
        'Invoke-WebRequest <c>' + base + '/upload/notes.txt</c> `\n  -Method Put -InFile <s>.\\notes.txt</s>' + tokenPwsh();
    },
    'wget': function () {
      return '<m># POST the file as the request body</m>\n' +
        'wget ' + tokenWget() + '--post-file=<s>notes.txt</s> \\\n  --header=<c>"Content-Type: application/octet-stream"</c> \\\n  <c>' + base + '/upload/notes.txt</c>';
    }
  };
  var current = 'curl · form';
  Object.keys(recipes).forEach(function (name) {
    var b = document.createElement('button');
    b.className = 'tab' + (name === current ? ' on' : '');
    b.textContent = name;
    b.onclick = function () {
      current = name;
      [].forEach.call(tabsEl.children, function (c) { c.classList.toggle('on', c.textContent === name); });
      renderSnippet();
    };
    tabsEl.appendChild(b);
  });
  // recipes use <c>/<s>/<m> shorthand; map to the .c/.s/.m spans styled in CSS (<s> would render as strikethrough)
  function renderSnippet() { snippetEl.innerHTML = recipes[current]().replace(/<([csm])>/g, '<span class="$1">').replace(/<\/[csm]>/g, '</span>'); }
  tok.addEventListener('input', renderSnippet);
  renderSnippet();

  copyBtn.addEventListener('click', function () {
    navigator.clipboard.writeText(snippetEl.textContent).then(function () {
      copyBtn.textContent = 'copied'; copyBtn.classList.add('done');
      setTimeout(function () { copyBtn.textContent = 'copy'; copyBtn.classList.remove('done'); }, 1400);
    });
  });

  function render() {
    listEl.innerHTML = '';
    queue.forEach(function (item) {
      var row = document.createElement('div');
      row.className = 'row';
      row.innerHTML =
        '<span class="k">&gt;</span>' +
        '<div class="meta"><div class="name"></div><div class="size">' + fmtSize(item.file.size) + '</div>' +
        '<div class="bar2 ' + (item.state || '') + '"><i style="width:' + (item.pct || 0) + '%"></i></div></div>' +
        '<div class="st ' + (item.state || '') + '"></div>';
      row.querySelector('.name').textContent = item.file.name;
      var st = row.querySelector('.st');
      st.textContent = item.msg || 'ready';
      listEl.appendChild(row);
      item._bar = row.querySelector('.bar2 > i');
      item._st = st;
    });
    sendBtn.disabled = queue.length === 0;
    clearBtn.disabled = queue.length === 0;
  }
  function add(files) {
    for (var i = 0; i < files.length; i++) queue.push({ file: files[i], pct: 0, state: '', msg: 'ready' });
    render();
  }
  picker.addEventListener('change', function () { add(picker.files); picker.value = ''; });
  ['dragenter', 'dragover'].forEach(function (e) { drop.addEventListener(e, function (ev) { ev.preventDefault(); drop.classList.add('drag'); }); });
  ['dragleave', 'drop'].forEach(function (e) { drop.addEventListener(e, function (ev) { ev.preventDefault(); drop.classList.remove('drag'); }); });
  drop.addEventListener('drop', function (ev) { if (ev.dataTransfer && ev.dataTransfer.files) add(ev.dataTransfer.files); });
  clearBtn.addEventListener('click', function () { queue = []; render(); });

  function upload(item) {
    return new Promise(function (resolve) {
      var fd = new FormData();
      fd.append('file', item.file, item.file.name);
      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/upload');
      var t = tok.value.trim();
      if (t) xhr.setRequestHeader('Authorization', 'Bearer ' + t);
      xhr.upload.onprogress = function (e) {
        if (e.lengthComputable) {
          item.pct = Math.round((e.loaded / e.total) * 100);
          if (item._bar) item._bar.style.width = item.pct + '%';
          if (item._st) item._st.textContent = item.pct + '%';
        }
      };
      xhr.onload = function () {
        var ok = xhr.status >= 200 && xhr.status < 300;
        if (item._st) { item._st.className = 'st ' + (ok ? 'ok' : 'err'); item._st.textContent = ok ? 'done' : 'fail ' + xhr.status; }
        if (item._bar) { item._bar.style.width = '100%'; item._bar.parentNode.className = 'bar2 ' + (ok ? 'ok' : 'err'); }
        item.state = ok ? 'ok' : 'err';
        resolve();
      };
      xhr.onerror = function () {
        item.state = 'err';
        if (item._st) { item._st.className = 'st err'; item._st.textContent = 'neterr'; }
        if (item._bar) item._bar.parentNode.className = 'bar2 err';
        resolve();
      };
      xhr.send(fd);
    });
  }
  sendBtn.addEventListener('click', async function () {
    sendBtn.disabled = true; clearBtn.disabled = true;
    for (var i = 0; i < queue.length; i++) if (queue[i].state !== 'ok') await upload(queue[i]);
    clearBtn.disabled = false;
    // re-enable so failed items (e.g. 401 before a token was entered) can be retried
    sendBtn.disabled = queue.every(function (q) { return q.state === 'ok'; });
  });

  // connection indicator (health ping; no logs exposed to the UI)
  function ping() {
    fetch('/health', { cache: 'no-store' })
      .then(function (r) { if (r.ok) { pulse.classList.add('live'); conntxt.textContent = 'online'; } else throw 0; })
      .catch(function () { pulse.classList.remove('live'); conntxt.textContent = 'offline'; });
  }
  ping();
  setInterval(ping, 5000);
})();
</script>
</body>
</html>
